version: "3"

tasks:
  sqlc:
    dir: auth/adapters/db
    cmds: [sqlc generate]
  gen:
    cmds: [go generate ./..., gofmt -w .]
  test:
    cmds: [go test -cover -coverprofile=coverage.out $(go list ./... | grep -v -E "/common/module|/adapters/db|/seed|/api/module|/api/module/clients") && go tool cover -func=coverage.out]
  test:component:
    desc: Run component tests against COMPONENT_TEST_POSTGRES_DSN
    cmds: [COMPONENT_TEST=1 go test ./tests -count=1]
  seed:
    desc: Load deterministic development fixtures into an already migrated database
    cmds: [docker compose run --rm --no-deps dealership /app/dealership-seed]
  build:dealership:
    desc: Build and recreate dealership project
    cmd: docker compose up -d --build dealership
  build:all:
    desc: Force to rebuild all services.
    cmd: docker compose up -d --build --force-recreate
