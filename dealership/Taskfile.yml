version: "3"

tasks:
  sqlc:
    dir: auth/adapters/db
    cmds: [sqlc generate]
  gen:
    cmds: [go generate ./..., gofmt -w .]
  test:
    cmds: [go test ./...]
  seed:
    desc: Load deterministic development fixtures into an already migrated database
    cmds: [docker compose run --rm --no-deps dealership /app/dealership-seed]
