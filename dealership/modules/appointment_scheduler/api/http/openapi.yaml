openapi: "3.0.3"
info:
  title: Dealership API
  version: "1.0.0"
  description: Dealership administration endpoints.
servers:
  - url: /appointment-scheduler/v1
paths:
  /dealerships/{dealershipId}/technician-schedules:
    parameters:
      - $ref: "#/components/parameters/DealershipId"
    get:
      operationId: listTechnicianSchedules
      tags: [Technician schedules]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: technician_id
          in: query
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
        - name: include
          in: query
          description: Comma-separated schedule sections. Defaults to appointments, time_off, and shifts.
          schema:
            type: array
            items: { type: string, enum: [appointments, time_off, shifts] }
          style: form
          explode: false
      responses:
        "200": { $ref: "#/components/responses/TechnicianSchedulesListed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /appointments:
    post:
      operationId: scheduleAppointment
      tags: [Appointments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleAppointmentRequest" }
      responses:
        "201": { $ref: "#/components/responses/AppointmentScheduled" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /appointments/{appointmentId}/check-in:
    parameters: [{ $ref: "#/components/parameters/AppointmentId" }]
    post:
      operationId: checkInAppointment
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentNoteRequest" } } } }
      responses: { "204": { description: Appointment checked in }, "400": { $ref: "#/components/responses/BadRequest" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /appointments/{appointmentId}/start:
    parameters: [{ $ref: "#/components/parameters/AppointmentId" }]
    post:
      operationId: startAppointment
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentNoteRequest" } } } }
      responses: { "204": { description: Appointment started }, "400": { $ref: "#/components/responses/BadRequest" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /appointments/{appointmentId}/complete:
    parameters: [{ $ref: "#/components/parameters/AppointmentId" }]
    post:
      operationId: completeAppointment
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CompleteAppointmentRequest" } } } }
      responses: { "204": { description: Appointment completed }, "400": { $ref: "#/components/responses/BadRequest" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /appointments/{appointmentId}/cancel:
    parameters: [{ $ref: "#/components/parameters/AppointmentId" }]
    post:
      operationId: cancelAppointment
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CancelAppointmentRequest" } } } }
      responses: { "204": { description: Appointment cancelled }, "400": { $ref: "#/components/responses/BadRequest" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /dealerships/{dealershipId}/operation-times:
    parameters:
      - $ref: "#/components/parameters/DealershipId"
    get:
      operationId: listDealershipOperationTimes
      tags: [Operation times]
      security: [{ bearerAuth: [] }]
