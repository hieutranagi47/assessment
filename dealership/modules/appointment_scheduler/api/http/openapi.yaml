        application/json:
          schema: { $ref: "#/components/schemas/Customer" }
    CustomerFound:
      description: Customer found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Customer" }
    CustomerUpdated:
      description: Customer updated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Customer" }
    CustomersListed:
