components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    AppointmentNoteRequest:
      type: object
      properties: { note: { type: string, nullable: true } }
    CompleteAppointmentRequest:
      type: object
      properties:
        actual_ends_at: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
    CancelAppointmentRequest:
      type: object
      required: [cancellation_reason]
      properties:
        cancellation_reason: { type: string, minLength: 1 }
        note: { type: string, nullable: true }
    ScheduleAppointmentRequest:
      type: object
      required: [customer_id, vehicle_id, service_type_id, starts_at, technician_id, service_bay_id]
      properties:
        customer_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        service_type_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time, description: UTC instant }
        technician_id: { type: string, format: uuid }
        service_bay_id: { type: string, format: uuid }
        planned_duration_minutes: { type: integer, minimum: 1 }
        notes: { type: string, nullable: true }
    Appointment:
      type: object
      required: [appointment_id, reference_code, dealership_id, starts_at, ends_at, planned_duration_minutes, status, created_at, updated_at]
      properties:
        appointment_id: { type: string, format: uuid }
        reference_code: { type: string }
        dealership_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        service_type_id: { type: string, format: uuid }
        technician_id: { type: string, format: uuid }
        service_bay_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        actual_ends_at: { type: string, format: date-time, nullable: true }
        planned_duration_minutes: { type: integer }
        status: { type: string, enum: [requested, checked_in, in_progress, completed, cancelled] }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateTechnicianRequest:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        email: { type: string, format: email, nullable: true }
        is_active: { type: boolean, default: true }
    UpdateTechnicianRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        email:
          nullable: true
          x-go-type: OptionalNullableString
        is_active: { type: boolean }
    Technician:
      type: object
      required: [technician_id, user_id, name, phone, is_active, created_at, updated_at]
      properties:
        technician_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TechnicianPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Technician" }
        limit: { type: integer }
        offset: { type: integer }
    CreateTechnicianSkillRequest:
      type: object
      required: [skill_id]
      properties:
        skill_id: { type: string, format: uuid }
    UpdateTechnicianSkillRequest:
      type: object
      required: [skill_id]
      properties:
        skill_id: { type: string, format: uuid }
    TechnicianSkill:
      type: object
      required: [technician_skill_id, technician_id, skill_id, created_at, updated_at]
      properties:
        technician_skill_id: { type: string, format: uuid }
        technician_id: { type: string, format: uuid }
        skill_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateTechnicianShiftRequest:
      type: object
      required: [day_of_week, starts_at, ends_at]
      properties:
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        starts_at: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        ends_at: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    UpdateTechnicianShiftRequest:
      type: object
      minProperties: 1
      properties:
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        starts_at: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        ends_at: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    TechnicianShift:
      type: object
      required: [technician_shift_id, technician_id, day_of_week, starts_at, ends_at, created_at, updated_at]
      properties:
        technician_shift_id: { type: string, format: uuid }
