      operationId: listServiceBays
      tags: [Service bays]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
