        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    CreateTechnicianRequest:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        email: { type: string, format: email, nullable: true }
        isActive: { type: boolean, default: true }
    UpdateTechnicianRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        email:
          nullable: true
          x-go-type: OptionalNullableString
        isActive: { type: boolean }
    Technician:
      type: object
      required: [technicianId, userId, name, phone, isActive, createdAt, updatedAt]
      properties:
        technicianId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TechnicianPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Technician" }
        limit: { type: integer }
        offset: { type: integer }
    CreateCustomerRequest:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        email: { type: string, format: email, nullable: true }
    UpdateCustomerRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        email:
          nullable: true
          x-go-type: OptionalNullableString
    Customer:
      type: object
      required: [customerId, name, phone, email, createdAt, updatedAt]
      properties:
        customerId: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{7,14}$' }
        email: { type: string, format: email, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomerListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
    CreateVehicleRequest:
      type: object
      required: [make, model]
      properties:
        vin: { type: string, minLength: 1, maxLength: 17 }
        registrationPlate: { type: string, minLength: 1, maxLength: 32 }
        make: { type: string, minLength: 1, maxLength: 100 }
        model: { type: string, minLength: 1, maxLength: 100 }
        modelYear: { type: integer, minimum: 1886, maximum: 2100 }
    UpdateVehicleRequest:
      type: object
      minProperties: 1
      properties:
        vin:
          nullable: true
          x-go-type: OptionalNullableString
        registrationPlate:
          nullable: true
          x-go-type: OptionalNullableString
        make: { type: string, minLength: 1, maxLength: 100 }
        model: { type: string, minLength: 1, maxLength: 100 }
        modelYear:
          nullable: true
          x-go-type: OptionalNullableInt
    Vehicle:
      type: object
      required: [vehicleId, customerId, make, model, createdAt, updatedAt]
      properties:
        vehicleId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        vin: { type: string, nullable: true }
        registrationPlate: { type: string, nullable: true }
        make: { type: string }
        model: { type: string }
        modelYear: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VehicleListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Vehicle" }
    CreateServiceBayRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        isActive: { type: boolean, default: true }
    UpdateServiceBayRequest:
      type: object
      minProperties: 1
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        isActive: { type: boolean }
    ServiceBay:
      type: object
      required: [serviceBayId, dealershipId, code, name, isActive, createdAt, updatedAt]
      properties:
        serviceBayId: { type: string, format: uuid }
        dealershipId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ServiceBayPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ServiceBay" }
        limit: { type: integer }
        offset: { type: integer }
    CreateServiceTypeRequest:
      type: object
      required: [name, defaultDurationMinutes, minDurationMinutes, maxDurationMinutes]
      properties:
        name: { type: string, minLength: 1 }
        defaultDurationMinutes: { type: integer, minimum: 1 }
        minDurationMinutes: { type: integer, minimum: 1 }
        maxDurationMinutes: { type: integer, minimum: 1 }
        isActive: { type: boolean, default: true }
    UpdateServiceTypeRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        defaultDurationMinutes: { type: integer, minimum: 1 }
        minDurationMinutes: { type: integer, minimum: 1 }
        maxDurationMinutes: { type: integer, minimum: 1 }
        isActive: { type: boolean }
    ServiceType:
      type: object
      required: [serviceTypeId, dealershipId, name, defaultDurationMinutes, minDurationMinutes, maxDurationMinutes, isActive, createdAt, updatedAt]
      properties:
        serviceTypeId: { type: string, format: uuid }
        dealershipId: { type: string, format: uuid }
        name: { type: string }
        defaultDurationMinutes: { type: integer }
        minDurationMinutes: { type: integer }
        maxDurationMinutes: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateServiceTypeRequiredSkillRequest:
      type: object
      required: [skillId]
      properties:
        skillId: { type: string, format: uuid }
    UpdateServiceTypeRequiredSkillRequest:
      type: object
      required: [skillId]
      properties:
        skillId: { type: string, format: uuid }
    Skill:
      type: object
      required: [skillId, code, name]
      properties:
        skillId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    ServiceTypeRequiredSkill:
      type: object
      required: [requiredSkillId, serviceTypeId, skill, createdAt, updatedAt]
      properties:
        requiredSkillId: { type: string, format: uuid }
        serviceTypeId: { type: string, format: uuid }
        skill: { $ref: "#/components/schemas/Skill" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateServiceTypeRequiredBayCapabilityRequest:
      type: object
      required: [bayCapabilityId]
      properties:
        bayCapabilityId: { type: string, format: uuid }
    UpdateServiceTypeRequiredBayCapabilityRequest:
      type: object
      required: [bayCapabilityId]
      properties:
        bayCapabilityId: { type: string, format: uuid }
    BayCapability:
      type: object
      required: [bayCapabilityId, code, name]
      properties:
        bayCapabilityId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    ServiceTypeRequiredBayCapability:
      type: object
      required: [requiredCapabilityId, serviceTypeId, bayCapability, createdAt, updatedAt]
      properties:
        requiredCapabilityId: { type: string, format: uuid }
        serviceTypeId: { type: string, format: uuid }
        bayCapability: { $ref: "#/components/schemas/BayCapability" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateServiceBayCapabilityRequest:
      type: object
      required: [bayCapabilityId]
      properties:
        bayCapabilityId: { type: string, format: uuid }
    UpdateServiceBayCapabilityRequest:
      type: object
      required: [bayCapabilityId]
      properties:
        bayCapabilityId: { type: string, format: uuid }
    ServiceBayCapability:
      type: object
      required: [serviceBayCapabilityId, serviceBayId, bayCapability, createdAt, updatedAt]
      properties:
        serviceBayCapabilityId: { type: string, format: uuid }
        serviceBayId: { type: string, format: uuid }
        bayCapability: { $ref: "#/components/schemas/BayCapability" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDealershipUserRequest:
      type: object
      required: [dealershipId, email, role]
      properties:
        dealershipId: { type: string, format: uuid }
        email: { type: string, format: email, example: user@example.com }
        role: { type: string, enum: [admin, dealer, staff] }
    DealershipUser:
      type: object
      required: [userId, authUserId, dealershipId, name, email, isActive, role, createdAt, updatedAt]
      properties:
        userId: { type: string, format: uuid }
        authUserId: { type: string, format: uuid }
        dealershipId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        isActive: { type: boolean }
        role: { type: string, enum: [admin, dealer, staff] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDealershipAdminRequest:
      type: object
      required: [dealershipId, name, email]
      properties:
        dealershipId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        phone: { type: string, nullable: true, example: "+84901234567" }
        email: { type: string, format: email, example: jane@example.com }
    AuthUser:
      type: object
      required: [userId, email, fullName, status, role]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        status: { type: string }
        role: { type: string }
    DealershipAdmin:
      type: object
      required: [userId, authUserId, dealershipId, name, isActive, role, createdAt, updatedAt]
      properties:
        userId: { type: string, format: uuid }
        authUserId: { type: string, format: uuid }
        dealershipId: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        isActive: { type: boolean }
        role: { type: string, enum: [admin] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDealershipRequest:
      type: object
      required: [name, code, address, timezone]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        timezone: { type: string, minLength: 1, example: Asia/Ho_Chi_Minh }
    Dealership:
      type: object
      required: [dealershipId, name, code, address, timezone, isActive, createdAt, updatedAt]
      properties:
        dealershipId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        address: { type: string }
        timezone: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DealershipOperationTime:
      type: object
      required:
        - operationTimeId
        - dealershipId
        - dayOfWeek
        - opensAt
        - closesAt
        - createdAt
        - updatedAt
      properties:
        operationTimeId: { type: string, format: uuid }
        dealershipId: { type: string, format: uuid }
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        opensAt: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        closesAt: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDealershipOperationTimeRequest:
      type: object
      required: [dayOfWeek, opensAt, closesAt]
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        opensAt: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        closesAt: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    UpdateDealershipOperationTimeRequest:
      type: object
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        opensAt: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        closesAt: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    ErrorDetail:
      type: object
      required: [entityType, entityId, errorSlug, message]
      properties:
        entityType: { type: string }
        entityId: { type: string }
        errorSlug: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [message, slug, details]
      properties:
        message: { type: string }
        slug: { type: string }
        details:
          type: array
          items: { $ref: "#/components/schemas/ErrorDetail" }
  responses:
    OperationTimeCreated:
      description: Operation time created
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DealershipOperationTime" }
    OperationTimeUpdated:
      description: Operation time updated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DealershipOperationTime" }
    OperationTimesListed:
      description: Operation times ordered by weekday and opening time
      content:
        application/json:
          schema:
            type: array
