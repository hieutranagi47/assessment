openapi: "3.0.3"
info:
  title: Dealership API
  version: "1.0.0"
  description: Dealership administration endpoints.
paths:
  /v1/dealerships/{dealershipId}/operation-times:
    parameters:
      - $ref: "#/components/parameters/DealershipId"
    get:
      operationId: listDealershipOperationTimes
      tags: [Operation times]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/OperationTimesListed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      operationId: createDealershipOperationTime
      tags: [Operation times]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDealershipOperationTimeRequest" }
      responses:
        "201": { $ref: "#/components/responses/OperationTimeCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /v1/dealerships/{dealershipId}/operation-times/{operationTimeId}:
    parameters:
      - $ref: "#/components/parameters/DealershipId"
      - $ref: "#/components/parameters/OperationTimeId"
    patch:
      operationId: updateDealershipOperationTime
      tags: [Operation times]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDealershipOperationTimeRequest" }
      responses:
        "200": { $ref: "#/components/responses/OperationTimeUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      operationId: deleteDealershipOperationTime
      tags: [Operation times]
      security: [{ bearerAuth: [] }]
